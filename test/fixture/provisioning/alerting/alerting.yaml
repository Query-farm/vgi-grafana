apiVersion: 1
contactPoints:
  - orgId: 1
    name: ops-webhook
    receivers:
      - uid: cp-webhook
        type: webhook
        settings:
          url: https://hooks.example.com/services/T000/B000?token=do-not-leak-webhook
          httpMethod: POST
          password: do-not-leak-webhook-password
        disableResolveMessage: false
  - orgId: 1
    name: ops-email
    receivers:
      - uid: cp-email
        type: email
        settings:
          addresses: oncall@example.com;sre@example.com
          singleEmail: true
        disableResolveMessage: true
policies:
  - orgId: 1
    receiver: ops-email
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ops-webhook
        object_matchers:
          - ['severity', '=', 'critical']
        continue: true
        group_wait: 10s
        routes:
          - receiver: ops-email
            object_matchers:
              - ['team', '=~', 'web|db']
            mute_time_intervals: ['weekends']
      - receiver: ops-email
        object_matchers:
          - ['severity', '!=', 'critical']
        repeat_interval: 12h
muteTimes:
  - orgId: 1
    name: weekends
    time_intervals:
      - weekdays: ['saturday', 'sunday']
        location: UTC
  - orgId: 1
    name: maintenance-window
    time_intervals:
      - times:
          - start_time: '02:00'
            end_time: '04:00'
        weekdays: ['tuesday']
        months: ['1:3']
groups:
  - orgId: 1
    name: web-availability
    folder: Alerts
    interval: 10s
    rules:
      - uid: rule-high-latency
        title: High latency
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: testdata
            model:
              refId: A
              scenarioId: csv_metric_values
              stringInput: '250,260,270'
              alias: latency_ms
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [200]}}]}
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels: {severity: critical, team: web}
        annotations: {summary: 'p95 latency above 200 ms', runbook_url: 'https://runbooks.example.com/latency'}
      - uid: rule-error-rate
        title: Error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: testdata
            model: {refId: A, scenarioId: csv_metric_values, stringInput: '1,2,1'}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: mean}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [5]}}]}
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels: {severity: warning, team: web}
        annotations: {summary: 'error rate above 5%'}
  - orgId: 1
    name: db-capacity
    folder: Alerts
    interval: 1m
    rules:
      - uid: rule-disk-full
        title: Disk almost full
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: testdata
            model: {refId: A, scenarioId: csv_metric_values, stringInput: '91,92,93'}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: math, expression: '$A > 90'}
        for: 0s
        isPaused: true
        labels: {severity: critical, team: db}
        annotations: {summary: 'disk above 90%'}
